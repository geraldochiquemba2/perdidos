services:
  - type: web
    name: localiza-angola
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node photo-server.cjs
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: NODE_ENV
        value: production
